<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
 <script src="script.js"></script>
<script>
let peer;
let localStream;
let currentRoom;
const peers = {};

const socket = io();
const videoGrid = document.getElementById("videoGrid");

// ================= JOIN =================
function joinRoom() {

  const roomId = document.getElementById("roomId").value;
  currentRoom = roomId;

  startMeeting(roomId);
}

// ================= START =================
async function startMeeting(roomId) {

  peer = new Peer();

  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });

  addVideo(localStream, "You");

  peer.on("open", id => {
    socket.emit("join-room", roomId, id);
  });

  peer.on("call", call => {
    call.answer(localStream);

    call.on("stream", remoteStream => {
      addVideo(remoteStream, "User");
    });
  });

  socket.on("user-connected", userId => {
    connectToNewUser(userId, localStream);
  });
}

// ================= CONNECT =================
function connectToNewUser(userId, stream) {

  const call = peer.call(userId, stream);

  call.on("stream", remoteStream => {
    addVideo(remoteStream, "User");
  });

  peers[userId] = call;
}

// ================= VIDEO UI =================
function addVideo(stream, name) {

  const wrapper = document.createElement("div");
  wrapper.className =
    "relative rounded-2xl overflow-hidden bg-black aspect-video border border-white/10";

  const video = document.createElement("video");
  video.srcObject = stream;
  video.autoplay = true;
  video.playsInline = true;
  video.className = "w-full h-full object-cover";

  const label = document.createElement("div");
  label.innerText = name;
  label.className =
    "absolute bottom-2 left-2 bg-black/60 px-3 py-1 rounded-lg text-sm";

  wrapper.appendChild(video);
  wrapper.appendChild(label);

  videoGrid.appendChild(wrapper);
}

// ================= MIC =================
function toggleMic() {
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
}

// ================= CAM =================
function toggleCam() {
  const track = localStream.getVideoTracks()[0];
  track.enabled = !track.enabled;
}

// ================= SCREEN SHARE =================
async function shareScreen() {

  const screenStream = await navigator.mediaDevices.getDisplayMedia({
    video: true
  });

  const screenTrack = screenStream.getVideoTracks()[0];

  Object.values(peers).forEach(call => {

    const sender = call.peerConnection.getSenders()
      .find(s => s.track?.kind === "video");

    if (sender) sender.replaceTrack(screenTrack);
  });

  addVideo(screenStream, "Screen");
}
</script>
